[workspace]
resolver = "2"
members = [
    "et-lib",
    "et-terminal",
    "et-client",
    "et-server",
    "et-tests",
]

[workspace.package]
version = "7.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Jason Gauci <jgmath2000@gmail.com>"]
description = "Eternal Terminal - Remote shell that automatically reconnects without interrupting the session"
repository = "https://github.com/MisterTea/EternalTerminal"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Networking
socket2 = { version = "0.5", features = ["all"] }

# Cryptography
sodiumoxide = "0.2"

# Protocol buffers
prost = "0.12"
prost-types = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Configuration
configparser = "3.0"

# Platform abstractions
nix = { version = "0.29", features = ["fs", "ioctl", "process", "signal", "term", "net", "user", "poll", "socket"] }
libc = "0.2"

# Testing
pretty_assertions = "1.4"

# Build dependencies
prost-build = "0.12"
